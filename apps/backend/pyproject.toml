[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the ai-agent-rag Q&A service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.146.0",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
