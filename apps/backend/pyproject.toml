[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the ai-agent-rag Q&A service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "docling>=2.40.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.0",
    "qdrant-client>=1.15.1,<1.16",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2",
    "torch",
    "torchvision",
    "uvicorn[standard]>=0.54.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
backend = "backend.main:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

# Direct deps so uv applies the CPU index. Transitive torch from Docling
# otherwise resolves the CUDA wheel from PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
