name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests and retrieval eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Start Ollama and pull bge-m3
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags && break
            sleep 2
          done
          docker exec ollama ollama pull bge-m3

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6333/readyz && break
            sleep 2
          done

      - name: Unit tests
        working-directory: apps/backend
        run: |
          uv sync
          uv run pytest \
            tests/test_fusion.py \
            tests/test_hybrid_search.py \
            tests/test_agent.py \
            tests/test_chunking.py \
            tests/test_embeddings.py \
            tests/test_conversion.py \
            tests/test_eval_metrics.py

      - name: Retrieval eval
        working-directory: apps/backend
        env:
          EMBEDDING_BASE_URL: http://127.0.0.1:11434
          EMBEDDING_MODEL: bge-m3
          QDRANT_URL: http://127.0.0.1:6333
          EVAL_COLLECTION: eval_golden
        run: uv run python -m evals.run --retrieval-only

  eval-full:
    name: Judged eval
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Start Ollama and pull bge-m3
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags && break
            sleep 2
          done
          docker exec ollama ollama pull bge-m3

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6333/readyz && break
            sleep 2
          done

      - name: Check for XAI_API_KEY
        id: key
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "XAI_API_KEY is not set; skipping the judged eval."
          fi

      - name: Full eval
        if: steps.key.outputs.present == 'true'
        working-directory: apps/backend
        env:
          EMBEDDING_BASE_URL: http://127.0.0.1:11434
          EMBEDDING_MODEL: bge-m3
          QDRANT_URL: http://127.0.0.1:6333
          EVAL_COLLECTION: eval_golden
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LLM_BASE_URL: https://api.x.ai/v1
          LLM_MODEL: grok-4.7
        run: |
          uv sync
          uv run python -m evals.run
